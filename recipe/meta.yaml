{% set python_min = '3.10' %}
{% set name = "control" %}
{% set version = "0.10.2" %}
{% set sha256 = "d0cf63f6cfb68a4c8e827c26c3744d129e9777fedc9a5d86ca4740548f23a98b" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: {{ sha256 }}

build:
  number: 1
  noarch: python

outputs:
  - name: {{ name|lower }}-base
    script: build.sh  # needs to be bash script when an output
    build:
      noarch: python
    requirements:
      build:
        - python                                 # [build_platform != target_platform]
        - cross-python_{{ target_platform }}     # [build_platform != target_platform]
      host:
        - pip
        - python {{ python_min }}
        - setuptools
        - setuptools-scm
      run:
        - python >={{ python_min }}
        - numpy
        - scipy
        - matplotlib-base
    test:
      requires:
        - python {{ python_min }}
      imports:
        - control
  - name: {{ name|lower }}
    requirements:
      host:
        - python {{ python_min }}
      run:
        - python >={{ python_min }}
        - {{ pin_subpackage('control-base', exact=True) }}
        - slycot
    test:
      requires:
        - python {{ python_min }}
      imports:
        - control

about:
  home: https://python-control.org
  license: BSD-3-Clause
  license_file: LICENSE
  dev_url: https://github.com/python-control/python-control
  doc_url: https://python-control.readthedocs.org/
  summary: 'Python Control Systems Library'

extra:
  recipe-maintainers:
    - moorepants
    - murrayrm
    - bnavigator
